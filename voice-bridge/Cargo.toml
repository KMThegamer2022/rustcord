[package]
name = "rustcord-voice"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.15"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
songbird = { version = "0.6.1", features = ["receive"], git = "https://github.com/serenity-rs/songbird", branch = "current" }
symphonia = { version = "0.5.2", features = ["pcm", "wav", "mp3"] }
symphonia-core = "0.5.2"
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

